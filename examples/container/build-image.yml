# GitHub Actions 예시 (초안) — main 푸시 시 amd64 이미지를 빌드해 GHCR에 게시
# ─────────────────────────────────────────────────────────────────────
# ⚠️ 예시입니다. 지금은 examples/ 폴더에 있어서 "실행되지 않습니다".
#    실제로 자동 빌드를 켜려면 이 파일을 아래 경로로 옮기세요:
#       .github/workflows/build-image.yml
#    그러면 main 에 push 할 때마다 GitHub 클라우드(amd64)에서 이미지를 빌드해
#       ghcr.io/saytu1/openfoam_tutorial1:latest  에 자동으로 올려줍니다.
#    회사 PC(WSL+Podman)는 `podman pull ghcr.io/saytu1/openfoam_tutorial1:latest` 로 받으면 끝.
# ─────────────────────────────────────────────────────────────────────
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:        # 수동 실행 버튼도 허용

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub 클라우드 러너 = amd64 (회사 PC용 아키텍처)
    permissions:
      contents: read
      packages: write       # GHCR 에 올리기 위한 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시 (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile              # ← Containerfile 을 저장소 루트로 옮긴 경우
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest   # = ghcr.io/saytu1/openfoam_tutorial1:latest
